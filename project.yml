name: AirPulse
options:
  bundleIdPrefix: com.airpulse.beam
  deploymentTarget:
    iOS: "15.0"
targets:
  AirPulse:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: AirPulse
        excludes:
          - "Info.plist"
          - "www"
      - path: AirPulse/www
        type: folder
    info:
      path: AirPulse/Info.plist
      properties:
        CFBundleDisplayName: "AirPulse"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airpulse.beam.AirPulse
        PRODUCT_NAME: AirPulse
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: AirPulse/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
